services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: twin
      POSTGRES_PASSWORD: ${TWIN_POSTGRES_PASSWORD:?Set a URL-safe local password}
      POSTGRES_DB: twinline
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U twin -d twinline"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    build:
      context: .
      dockerfile: docker/backend.Dockerfile
    environment:
      TWIN_DATABASE_URL: postgresql+psycopg2://twin:${TWIN_POSTGRES_PASSWORD}@postgres:5432/twinline
      TWIN_SEED_VEHICLES: ${TWIN_SEED_VEHICLES:-1500}
      TWIN_SCENARIO: mixed
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - modeldata:/app/data/models
    healthcheck:
      test: ["CMD", "python", "-c", "from urllib.request import urlopen; urlopen('http://127.0.0.1:8000/ready', timeout=3)"]
      interval: 5s
      timeout: 4s
      retries: 30
      start_period: 120s
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build:
      context: .
      dockerfile: docker/frontend.Dockerfile
    environment:
      API_UPSTREAM: http://backend:8000
    ports:
      - "127.0.0.1:5173:5173"
    depends_on:
      backend:
        condition: service_healthy

  # --- optional ops stack: docker compose --profile ops up ---
  prometheus:
    image: prom/prometheus:v2.53.0
    profiles: ["ops"]
    volumes:
      - ./docker/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
    ports:
      - "127.0.0.1:9090:9090"
    depends_on:
      - backend

  grafana:
    image: grafana/grafana:11.0.0
    profiles: ["ops"]
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
    volumes:
      - ./docker/grafana/provisioning:/etc/grafana/provisioning
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      - prometheus

volumes:
  pgdata:
  modeldata:
